<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha Van: Gestão do TAC</title>
<meta name="theme-color" content="#16324f">
<meta name="description" content="Controle de viagens, gastos e manutenção para o transportador autônomo.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Minha Van">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  color-scheme: light;
  --bg:#f3f4f1; --card:#ffffff; --ink:#15171a; --ink2:#4f545c; --muted:#868b93; --line:#e3e4df;
  --brand:#16324f; --brand2:#22507d; --accent:#f2a900; --accentInk:#3a2a00;
  --good:#1a7f37; --goodBg:#e6f4ea; --warn:#a15c00; --warnBg:#fff3d6; --bad:#c62828; --badBg:#fdecec;
  --s1:#2a78d6; --s2:#eb6834; --seq:#2a78d6;
  --radius:16px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#121417; --card:#1c1f24; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8e9199; --line:#2c3037;
    --brand:#0f2236; --brand2:#2b5f93; --accent:#f2b51d; --accentInk:#2a1e00;
    --good:#4cc26b; --goodBg:#16301e; --warn:#f0b54a; --warnBg:#33270f; --bad:#ff7a7a; --badBg:#3a1a1a;
    --s1:#3987e5; --s2:#d95926; --seq:#3987e5;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand2)}
@media (prefers-color-scheme: dark){a{color:#7fb3ec}}

/* Header */
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:12px}
.top .logo{width:38px;height:38px;border-radius:11px;background:var(--accent);display:grid;place-items:center;flex:none}
.top h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.01em}
.top .sub{font-size:12px;opacity:.75}
.top .grow{flex:1;min-width:0}
.iconbtn{background:rgba(255,255,255,.12);border:0;color:#fff;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.sync{font-size:11px;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.14);white-space:nowrap}

main{max-width:980px;margin:0 auto;padding:14px 14px calc(env(safe-area-inset-bottom) + 96px)}
h2{font-size:20px;margin:6px 2px 12px;font-weight:800;letter-spacing:-.02em}
h3{font-size:15px;margin:0 0 10px;font-weight:700}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:12px}
.muted{color:var(--muted)} .ink2{color:var(--ink2)}
.small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:720px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.cols2{grid-template-columns:1fr 1fr}}
@media(max-width:719px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Chips / segmented */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:13.5px;color:var(--ink2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
@media (prefers-color-scheme: dark){.chip.on{background:var(--brand2);border-color:var(--brand2)}}
.period{display:flex;align-items:center;gap:6px;margin:10px 0 14px}
.period .lbl{flex:1;text-align:center;font-weight:700}
.navbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px}

/* KPI */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.kpi .v{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--ink2);margin-top:2px}
.kpi.hero{grid-column:1/-1;background:var(--brand);color:#fff;border:0}
.kpi.hero .k{color:rgba(255,255,255,.7)} .kpi.hero .d{color:rgba(255,255,255,.8)}
.kpi.hero .v{font-size:32px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.kpi.hero .pos{color:#8ff0a8} .kpi.hero .neg{color:#ffb3b3}

/* Alerts */
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:14px}
.alert.bad{background:var(--badBg)} .alert.warn{background:var(--warnBg)} .alert.good{background:var(--goodBg)} .alert.info{background:var(--bg);border:1px solid var(--line)}
.alert .ic{flex:none;font-size:16px;line-height:1.3}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--goodBg);color:var(--good)} .pill.warn{background:var(--warnBg);color:var(--warn)} .pill.bad{background:var(--badBg);color:var(--bad)} .pill.neu{background:var(--bg);color:var(--ink2);border:1px solid var(--line)}

/* Lists */
.item{display:flex;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bg);flex:none;font-size:18px}
.item .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:800;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:6px}

/* Buttons */
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.pri{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.btn.dark{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.danger{background:var(--badBg);color:var(--bad);border-color:transparent}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}

/* Bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
.bnav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;cursor:pointer}
.bnav button svg{width:23px;height:23px}
.bnav button.on{color:var(--brand2)}
@media (prefers-color-scheme: dark){.bnav button.on{color:#7fb3ec}}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:31;width:60px;height:60px;border-radius:20px;border:0;background:var(--accent);color:var(--accentInk);font-size:32px;font-weight:500;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;display:grid;place-items:center}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:720px){.ov{align-items:center}}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px)}
@media(min-width:720px){.sheet{border-radius:22px}}
.sheet h3{font-size:18px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.field .hint{font-size:12px;color:var(--muted);margin-top:4px}
.inp{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px;outline:none}
.inp:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(42,120,214,.18)}
textarea.inp{min-height:70px;resize:vertical}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:center;padding:6px 0}
.check input{width:22px;height:22px}
.calc{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;border:1px dashed var(--line)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick button{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700}
.quick button .e{font-size:28px}

/* Progress */
.bar{height:8px;background:var(--bg);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:8px}

/* Charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);margin:6px 0 4px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--card);font-size:12.5px;padding:7px 10px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s;z-index:5;line-height:1.45}
.tip b{font-weight:700}
.hbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;font-size:13.5px;margin-bottom:8px}
.hbar .track{height:14px;border-radius:4px;background:transparent;position:relative}
.hbar .track i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--seq)}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.hbar .vl{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;min-width:88px}

table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;padding:6px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.t td.r,table.t th.r{text-align:right}
.tscroll{overflow-x:auto}

/* ANTT */
.rule{border-left:4px solid var(--accent);padding:2px 0 2px 12px;margin:12px 0}
.rule h4{margin:0 0 4px;font-size:15px}
.rule p{margin:4px 0;color:var(--ink2);font-size:14px}
.rule ul{margin:4px 0;padding-left:18px;color:var(--ink2);font-size:14px}
.src{font-size:12px;color:var(--muted)}
details.card summary{cursor:pointer;font-weight:700;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary:after{content:"＋";float:right;color:var(--muted)}
details.card[open] summary:after{content:"－"}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 150px);transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;z-index:80;font-weight:600;font-size:14px;max-width:90vw;text-align:center}
.banner{background:var(--warnBg);border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px}
.sep{height:1px;background:var(--line);margin:12px 0}
.tabs2{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.tabs2 button{flex:1;border:0;background:none;padding:9px 6px;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer;font-size:13.5px}
.tabs2 button.on{background:var(--bg);color:var(--ink);box-shadow:var(--shadow)}
</style>
</head>
<body>
<header class="top">
  <div class="logo" aria-hidden="true">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3a2a00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 16V8a2 2 0 0 1 2-2h10l5 5h1a2 2 0 0 1 2 2v3h-2"/><path d="M5 16H2"/><path d="M15 16H9"/><path d="M14 6v5h5"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
  </div>
  <div class="grow">
    <h1 id="hdrTitle">Minha Van</h1>
    <div class="sub" id="hdrSub">Gestão do transportador autônomo</div>
  </div>
  <span class="sync" id="syncChip">📱 salvo no celular</span>
  <button class="iconbtn" id="btnCfg" aria-label="Ajustes">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<main id="app"></main>

<button class="fab" id="fab" aria-label="Novo lançamento">+</button>

<nav class="bnav" id="bnav">
  <button data-v="painel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Painel</button>
  <button data-v="viagens"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8.5a3.5 3.5 0 0 0 0-7h-9a3.5 3.5 0 0 1 0-7H16"/></svg>Viagens</button>
  <button data-v="gastos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>Gastos</button>
  <button data-v="manutencao"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>Manutenção</button>
  <button data-v="antt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/></svg>Regras</button>
</nav>

<div class="tip" id="tip"></div>

<script>
/* ===================== Utilidades ===================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if (v === '' || v == null) return 0; const n = typeof v === 'number' ? v : parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const R$ = v => (v || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const R$c = v => { const a = Math.abs(v||0); if (a >= 1e6) return 'R$ ' + (v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1}) + ' mi'; if (a >= 1e4) return 'R$ ' + (v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:1}) + ' mil'; return R$(v); };
const N = (v, d = 0) => (v || 0).toLocaleString('pt-BR', {minimumFractionDigits:d, maximumFractionDigits:d});
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const today = () => iso(new Date());
const parseD = s => { if (!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fmtD = s => { const d = parseD(s); return d ? pad(d.getDate()) + '/' + pad(d.getMonth()+1) + '/' + d.getFullYear() : '—'; };
const fmtDs = s => { const d = parseD(s); return d ? pad(d.getDate()) + '/' + pad(d.getMonth()+1) : '—'; };
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MES3 = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DIAS3 = ['dom','seg','ter','qua','qui','sex','sáb'];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const addBusinessDays = (s, n) => { const d = parseD(s); let c = 0; while (c < n) { d.setDate(d.getDate()+1); const w = d.getDay(); if (w !== 0 && w !== 6) c++; } return iso(d); };
const norm = s => String(s || '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const title = s => String(s || '').trim().replace(/\s+/g, ' ');

function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

/* ===================== Categorias ===================== */
const CAT_GASTO = ['Pedágio','Arla 32','Alimentação','Pernoite / Hospedagem','Manutenção','Pneus','Peças','Lavagem','Chapa / Descarga','Prestação da van','Seguro','Rastreador','INSS / Impostos','IPVA / Licenciamento','Documentos / RNTRC','Multas','Telefone / Internet','Outros'];
const CAT_ICO = {'Combustível':'⛽','Pedágio':'🛣️','Arla 32':'💧','Alimentação':'🍽️','Pernoite / Hospedagem':'🛏️','Manutenção':'🔧','Pneus':'🛞','Peças':'⚙️','Lavagem':'🧽','Chapa / Descarga':'📦','Prestação da van':'🏦','Seguro':'🛡️','Rastreador':'📡','INSS / Impostos':'🧾','IPVA / Licenciamento':'📄','Documentos / RNTRC':'🪪','Multas':'🚨','Telefone / Internet':'📱','Outros':'📌'};
const CAT_CONTA = ['Prestação da van','Seguro','Rastreador','INSS / Impostos','IPVA / Licenciamento','Telefone / Internet','Outros'];
const DOCS_SUG = ['RNTRC (ANTT)','CNH','Exame toxicológico','CRLV / Licenciamento','Seguro da van','Seguros obrigatórios (RCTR-C / RC-DC / RC-V)','Aferição do tacógrafo (se PBT acima de 4.536 kg)','Curso MOPP','Contrato de agregado'];
const MANUT_PADRAO = [
  {item:'Troca de óleo do motor + filtro', tipo:'Manutenção', intervaloKm:10000, intervaloMeses:12},
  {item:'Filtro de combustível', tipo:'Manutenção', intervaloKm:20000, intervaloMeses:12},
  {item:'Filtro de ar do motor', tipo:'Manutenção', intervaloKm:20000, intervaloMeses:12},
  {item:'Filtro do ar-condicionado (cabine)', tipo:'Manutenção', intervaloKm:15000, intervaloMeses:12},
  {item:'Pastilhas e discos de freio', tipo:'Manutenção', intervaloKm:30000, intervaloMeses:0},

/* ===================== Armazenamento ===================== */
const COLS = ['viagens','abast','gastos','manut','servicos','contas','docs','config'];
const S = {}; COLS.forEach(c => S[c] = []);
const LKEY = 'meucaminhao_v1';
const MKEY = 'meucaminhao_meta';
function metaGet() { try { return JSON.parse(localStorage.getItem(MKEY) || '{}'); } catch (e) { return {}; } }
function metaSet(o) { try { localStorage.setItem(MKEY, JSON.stringify(Object.assign(metaGet(), o))); } catch (e) {} }
let STORAGE_OK = true;

function lsGet() { try { const r = localStorage.getItem(LKEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function lsSet() { try { const o = {}; COLS.forEach(c => o[c] = S[c]); localStorage.setItem(LKEY, JSON.stringify(o)); return true; } catch (e) { return false; } }
function loadLocal() { const o = lsGet(); if (o) COLS.forEach(c => S[c] = Array.isArray(o[c]) ? o[c] : []); }

async function save(col, obj) {
  if (!obj.id) obj.id = uid();
  obj.atualizado = new Date().toISOString();
  const arr = S[col]; const i = arr.findIndex(x => x.id === obj.id);
  if (i >= 0) arr[i] = obj; else arr.push(obj);
  if (!lsSet()) { toast('Não consegui salvar. A memória do celular pode estar cheia. Faça um backup em Ajustes.'); return false; }
  return true;
}
async function del(col, id) { S[col] = S[col].filter(x => x.id !== id); lsSet(); }
function setSync() { $('#syncChip').textContent = STORAGE_OK ? '📱 salvo no celular' : '⚠️ sem memória'; }
async function pedirPersistencia() {
  try { if (navigator.storage && navigator.storage.persist) { const ja = await navigator.storage.persisted(); if (!ja) await navigator.storage.persist(); } } catch (e) {}
}
function testarStorage() { try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch (e) { STORAGE_OK = false; } }

/* ===================== Cálculos ===================== */
const cfg = () => S.config.find(c => c.id === 'principal') || {};
const kmViagem = v => { const a = num(v.odoIni), b = num(v.odoFim); return (a && b && b > a) ? b - a : num(v.km); };
function odometroAtual() {
  let m = num(cfg().odometro);
  S.abast.forEach(a => m = Math.max(m, num(a.odometro)));
  S.viagens.forEach(v => m = Math.max(m, num(v.odoFim)));
  S.servicos.forEach(s => m = Math.max(m, num(s.km)));
  return m;
}
function despesas() {
  const out = [];
  S.gastos.forEach(g => out.push({id:g.id, col:'gastos', data:g.data, cat:g.categoria || 'Outros', valor:num(g.valor), desc:g.descricao || '', viagemId:g.viagemId}));
  S.abast.forEach(a => out.push({id:a.id, col:'abast', data:a.data, cat:'Combustível', valor:num(a.valor), desc:(a.posto ? a.posto + ' · ' : '') + N(num(a.litros),1) + ' L', viagemId:a.viagemId}));
  S.servicos.forEach(s => out.push({id:s.id, col:'servicos', data:s.data, cat:s.tipo || 'Manutenção', valor:num(s.valor), desc:s.descricao || '', viagemId:s.viagemId}));
  return out;
}
const inR = (s, r) => s && s >= r[0] && s <= r[1];
function range(p, ref) {
  const d = new Date(ref);
  if (p === 'hoje') { const s = iso(d); return [s, s]; }
  if (p === 'semana') { const w = (d.getDay() + 6) % 7; const a = new Date(d); a.setDate(d.getDate() - w); const b = new Date(a); b.setDate(a.getDate() + 6); return [iso(a), iso(b)]; }
  if (p === 'mes') return [iso(new Date(d.getFullYear(), d.getMonth(), 1)), iso(new Date(d.getFullYear(), d.getMonth()+1, 0))];
  if (p === 'ano') return [d.getFullYear() + '-01-01', d.getFullYear() + '-12-31'];
  return ['0000-01-01', '9999-12-31'];
}
function rangeLabel(p, ref) {
  const d = new Date(ref);
  if (p === 'hoje') return (iso(d) === today() ? 'Hoje, ' : DIAS3[d.getDay()] + ', ') + fmtD(iso(d));
  if (p === 'semana') { const r = range(p, ref); return fmtDs(r[0]) + ' a ' + fmtDs(r[1]); }
  if (p === 'mes') return MESES[d.getMonth()].replace(/^./, c => c.toUpperCase()) + ' de ' + d.getFullYear();
  if (p === 'ano') return 'Ano de ' + d.getFullYear();
  return 'Todo o período';
}
function shiftRef(p, ref, dir) {
  const d = new Date(ref);
  if (p === 'hoje') d.setDate(d.getDate() + dir);
  else if (p === 'semana') d.setDate(d.getDate() + 7*dir);
  else if (p === 'mes') { d.setDate(1); d.setMonth(d.getMonth() + dir); }
  else if (p === 'ano') d.setFullYear(d.getFullYear() + dir);
  return d;
}
function consumo(abList) {
  // Média km/L: km entre abastecimentos de tanque cheio / litros do abastecimento atual
  const all = S.abast.filter(a => num(a.odometro) > 0).slice().sort((a, b) => num(a.odometro) - num(b.odometro));
  const per = {};
  for (let i = 1; i < all.length; i++) {
    const km = num(all[i].odometro) - num(all[i-1].odometro);
    const L = num(all[i].litros);
    if (km > 0 && L > 0 && all[i].cheio !== false) per[all[i].id] = {km, L, kml: km / L};
  }
  let km = 0, L = 0;
  (abList || []).forEach(a => { if (per[a.id]) { km += per[a.id].km; L += per[a.id].L; } });
  return {per, media: L > 0 ? km / L : 0};
}
function statusManut(m) {
  const odo = odometroAtual();
  let pk = 0, pd = 0, faltaKm = null, faltaDias = null;
  if (num(m.intervaloKm) > 0 && num(m.ultimoKm) > 0 && odo > 0) { const uso = odo - num(m.ultimoKm); pk = uso / num(m.intervaloKm); faltaKm = num(m.intervaloKm) - uso; }
  if (num(m.intervaloMeses) > 0 && m.ultimaData) { const dias = daysBetween(m.ultimaData, today()); const tot = num(m.intervaloMeses) * 30.44; pd = dias / tot; faltaDias = Math.round(tot - dias); }
  const p = Math.max(pk, pd);
  const semBase = !(num(m.ultimoKm) > 0 || m.ultimaData);
  const st = semBase ? 'neu' : p >= 1 ? 'bad' : p >= .85 ? 'warn' : 'good';
  return {p, st, faltaKm, faltaDias, semBase};
}
function contaInfo(c, mesRef) {
  const pags = S.gastos.filter(g => g.contaId === c.id);
  const pagasApp = pags.length;
  const pagas = num(c.parcelasPagas) + pagasApp;
  const total = num(c.totalParcelas);
  const restantes = total > 0 ? Math.max(0, total - pagas) : null;
  const pagoMes = pags.some(g => g.ref === mesRef);
  const [y, m] = mesRef.split('-').map(Number);
  const lastDay = new Date(y, m, 0).getDate();
  const venc = mesRef + '-' + pad(Math.min(num(c.dia) || 1, lastDay));
  const quitada = total > 0 && restantes === 0;
  return {pagas, total, restantes, pagoMes, venc, quitada, saldo: restantes != null ? restantes * num(c.valor) : null};
}
function alertas() {
  const out = []; const hoje = today();
  S.manut.forEach(m => { const s = statusManut(m); if (s.st === 'bad') out.push({t:'bad', ic:'🔧', m:`<b>${esc(m.item)}</b> está vencida. ${s.faltaKm != null && s.faltaKm < 0 ? 'Passou ' + N(-s.faltaKm) + ' km.' : ''}`}); else if (s.st === 'warn') out.push({t:'warn', ic:'🔧', m:`<b>${esc(m.item)}</b> vence em breve${s.faltaKm != null ? ' (faltam ' + N(Math.max(0,s.faltaKm)) + ' km)' : ''}${s.faltaDias != null ? ' · ' + Math.max(0,s.faltaDias) + ' dias' : ''}.`}); });
  const mref = hoje.slice(0, 7);
  S.contas.filter(c => c.ativo !== false).forEach(c => { const i = contaInfo(c, mref); if (i.quitada || i.pagoMes) return; const d = daysBetween(hoje, i.venc); if (d < 0) out.push({t:'bad', ic:'🏦', m:`<b>${esc(c.nome)}</b> venceu dia ${fmtDs(i.venc)} (${R$(num(c.valor))}).`}); else if (d <= 5) out.push({t:'warn', ic:'🏦', m:`<b>${esc(c.nome)}</b> vence ${d === 0 ? 'hoje' : 'em ' + d + ' dia' + (d>1?'s':'')} (${R$(num(c.valor))}).`}); });
  S.docs.forEach(d => { if (!d.vencimento) return; const x = daysBetween(hoje, d.vencimento); if (x < 0) out.push({t:'bad', ic:'🪪', m:`<b>${esc(d.nome)}</b> está vencido desde ${fmtD(d.vencimento)}.`}); else if (x <= 30) out.push({t:'warn', ic:'🪪', m:`<b>${esc(d.nome)}</b> vence em ${x} dia${x!==1?'s':''} (${fmtD(d.vencimento)}).`}); });
  const totReg = COLS.reduce((a, c) => a + S[c].length, 0); const ub = metaGet().ultimoBackup;
  if (totReg >= 5 && (!ub || daysBetween(ub, hoje) > 7)) out.push({t:'info', ic:'💾', m:`${ub ? 'Seu último backup foi em ' + fmtD(ub) + '.' : 'Você ainda não fez nenhum backup.'} Os dados ficam só neste celular: <a href="#ajustes" data-go="ajustes">faça um backup agora</a>.`});
  S.viagens.forEach(v => { if (v.statusPag === 'Pago') return; const base = v.dataChegada || v.dataSaida; if (!base) return; const lim = v.prevPag || addBusinessDays(base, 30); if (hoje > lim) out.push({t:'bad', ic:'💰', m:`Frete <b>${esc(v.origem)} → ${esc(v.destino)}</b> (${fmtDs(v.dataSaida)}) sem pagamento. Prazo era ${fmtD(lim)}.`}); });
  return out;
}

/* ---------- Painel ---------- */
function vPainel() {

function buckets(r) {
  const out = [];
  if (UI.p === 'hoje' || UI.p === 'semana') {
    const s = UI.p === 'hoje' ? range('semana', UI.ref) : r;
    for (let d = parseD(s[0]); iso(d) <= s[1]; d.setDate(d.getDate()+1)) { const k = iso(d); out.push({lbl: DIAS3[d.getDay()], full: fmtD(k), test: x => x === k}); }
  } else if (UI.p === 'mes') {
    for (let d = parseD(r[0]); iso(d) <= r[1]; d.setDate(d.getDate()+1)) { const k = iso(d); out.push({lbl: String(d.getDate()), full: fmtD(k), test: x => x === k}); }
  } else {
    let y0, m0, y1, m1;
    if (UI.p === 'ano') { y0 = y1 = new Date(UI.ref).getFullYear(); m0 = 0; m1 = 11; }
    else {
      const ds = [...S.viagens.map(v => v.dataSaida), ...despesas().map(d => d.data)].filter(Boolean).sort();
      const now = new Date(); y1 = now.getFullYear(); m1 = now.getMonth();
      if (ds.length) { const f = parseD(ds[0]); y0 = f.getFullYear(); m0 = f.getMonth(); } else { y0 = y1; m0 = m1; }
      const tot = (y1 - y0) * 12 + (m1 - m0); if (tot > 23) { const d = new Date(y1, m1 - 23, 1); y0 = d.getFullYear(); m0 = d.getMonth(); }
    }
    for (let d = new Date(y0, m0, 1); d <= new Date(y1, m1, 1); d.setMonth(d.getMonth()+1)) { const k = d.getFullYear() + '-' + pad(d.getMonth()+1); out.push({lbl: MES3[d.getMonth()] + (UI.p==='tudo' ? '/' + String(d.getFullYear()).slice(2) : ''), full: MESES[d.getMonth()] + ' ' + d.getFullYear(), test: x => x && x.slice(0,7) === k}); }
  }
  return out;
}
function chartRecGas(r) {
  const bs = buckets(r); const des = despesas();
  bs.forEach(b => { b.rec = S.viagens.filter(v => b.test(v.dataSaida)).reduce((a, v) => a + num(v.valorFrete), 0); b.gas = des.filter(d => b.test(d.data)).reduce((a, d) => a + d.valor, 0); });
  const max = Math.max(1, ...bs.map(b => Math.max(b.rec, b.gas)));
  if (bs.every(b => !b.rec && !b.gas)) return '<div class="empty">Sem lançamentos para mostrar no gráfico.</div>';
  const W = 600, H = 220, L = 46, B = 26, T = 8, Rr = 6;
  const pw = W - L - Rr, ph = H - B - T, n = bs.length, slot = pw / n;
  const bw = Math.max(2, Math.min(22, (slot - 4) / 2 - 1));
  const nice = niceMax(max); const y = v => T + ph - (v / nice) * ph;
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = nice * i / 4; const yy = y(v); g += `<line x1="${L}" x2="${W-Rr}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--muted)">${shortN(v)}</text>`; }
  const every = n > 16 ? Math.ceil(n / 10) : 1;
  bs.forEach((b, i) => {
    const cx = L + slot * i + slot / 2;
    const x1 = cx - bw - 1, x2 = cx + 1;
    if (b.rec) g += barPath(x1, y(b.rec), bw, T + ph - y(b.rec), 'var(--s1)');
    if (b.gas) g += barPath(x2, y(b.gas), bw, T + ph - y(b.gas), 'var(--s2)');
    if (i % every === 0) g += `<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(b.lbl)}</text>`;
    g += `<rect x="${L + slot*i}" y="${T}" width="${slot}" height="${ph}" fill="transparent" data-tip="<b>${esc(b.full)}</b><br>Faturamento: ${esc(R$(b.rec))}<br>Gastos: ${esc(R$(b.gas))}<br>Lucro: ${esc(R$(b.rec-b.gas))}"/>`;
  });
  g += `<line x1="${L}" x2="${W-Rr}" y1="${T+ph}" y2="${T+ph}" stroke="var(--muted)" stroke-width="1"/>`;
  return `<div class="legend"><span><i style="background:var(--s1)"></i>Faturamento</span><span><i style="background:var(--s2)"></i>Gastos</span></div><div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de faturamento e gastos">${g}</svg></div><div class="small muted">Toque nas barras para ver os valores.</div>`;
}
function barPath(x, yTop, w, h, fill) { if (h <= 0) return ''; const r = Math.min(4, w/2, h); return `<path d="M${x},${yTop+h} V${yTop+r} Q${x},${yTop} ${x+r},${yTop} H${x+w-r} Q${x+w},${yTop} ${x+w},${yTop+r} V${yTop+h} Z" fill="${fill}"/>`; }
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function shortN(v) { if (v >= 1e6) return N(v/1e6,1) + 'mi'; if (v >= 1e3) return N(v/1e3, v % 1000 ? 1 : 0) + 'mil'; return N(v); }
function catBars(ds, tot) {
  if (!ds.length) return '<div class="empty">Nenhum gasto no período.</div>';

  const arr = Object.entries(m).sort((a, b) => b[1] - a[1]); const mx = arr[0][1] || 1;
  let rows = arr.slice(0, 8);

  return rows.map(([c, v]) => `<div class="hbar" data-tip="<b>${esc(c)}</b><br>${esc(R$(v))} · ${N(v/tot*100,1)}% dos gastos"><span class="nm">${CAT_ICO[c]||'•'} ${esc(c)}</span><span class="track"><i style="width:${Math.max(1.5, v/mx*100)}%"></i></span><span class="vl">${R$c(v)} <span class="muted small">${N(v/tot*100,0)}%</span></span></div>`).join('');
}
function rotasTable(vs) {

}
function clientesTable(vs) {

}

/* ---------- Viagens ---------- */
function lucroViagem(v) { const g = despesas().filter(d => d.viagemId === v.id).reduce((a, d) => a + d.valor, 0); return {g, l: num(v.valorFrete) - g}; }
function itemViagem(v) {

function mesPicker(key, val, allowAll) {

}
function topCat(ds) { const m = {}; ds.forEach(d => m[d.cat] = (m[d.cat]||0) + d.valor); const t = Object.entries(m).sort((a,b) => b[1]-a[1])[0]; return t ? (CAT_ICO[t[0]]||'') + ' ' + t[0] : '—'; }
function vContas() {

/* ---------- ANTT / Regras ---------- */
function vAntt() {
  const ds = S.docs.slice().sort((a, b) => (a.vencimento || '9').localeCompare(b.vencimento || '9'));
  let h = `<h2>Regras e documentos</h2>`;

  h += `<div class="card"><h3>🧮 Meu frete está acima do piso?</h3><div class="small muted" style="margin-bottom:10px">Pegue o valor do piso na calculadora oficial da ANTT (link abaixo) e compare com o que te ofereceram.</div>
  <div class="frow"><div class="field"><label>Frete oferecido (R$)</label><input class="inp" id="pzF" type="number" inputmode="decimal" step="0.01"></div><div class="field"><label>Piso ANTT (R$)</label><input class="inp" id="pzP" type="number" inputmode="decimal" step="0.01"></div></div>
  <div class="frow"><div class="field"><label>Distância (km)</label><input class="inp" id="pzK" type="number" inputmode="numeric"></div><div class="field"><label>Pedágio pago por fora?</label><select class="inp" id="pzV"><option value="1">Sim, vale-pedágio</option><option value="0">Não</option></select></div></div>
  <div class="calc" id="pzOut">Preencha os campos para comparar.</div>
  <a href="https://calculadorafrete.antt.gov.br/" target="_blank" rel="noopener">Abrir calculadora oficial do piso (ANTT) ↗</a></div>`;

  h += `<div class="card"><h3>📌 Resumo das regras para o TAC agregado</h3><div class="small muted">Conferido em 17/11/2026. As regras mudam com frequência: sempre confirme no site da ANTT.</div>

  <div class="rule"><h4>1. Piso mínimo de frete é obrigatório</h4>
  <p>Desde a Lei 15.485/2026 (que converteu a MP 1.343/2026), o pagamento ao TAC agregado e ao TAC independente tem que respeitar o piso mínimo de frete da Lei 13.703/2018. Quem contrata abaixo do piso pode ter que indenizar o transportador em até 2 vezes o valor do piso.</p>
  <p>A ANTT revisa a tabela duas vezes por ano (janeiro e julho) e também quando o diesel varia acima do gatilho. O último reajuste conhecido usou diesel S10 de <b>R$ 7,33/L</b> como referência, com valores em vigor desde 30/09/2026.</p>
  <p class="src">Fontes: Lei 15.485/2026; SETCESP; Mundo Logística.</p></div>

  <div class="rule"><h4>2. CIOT agora bloqueia frete abaixo do piso</h4>
  <p>O CIOT deixou de ser só um registro: se o valor informado for menor que o piso, o sistema não gera o código e a viagem fica sem regularidade. Sem CIOT, não há transporte regular.</p>
  <p>Para <b>TAC agregado</b>, cada CIOT cobre um vínculo de no mínimo 10 e no máximo 30 dias, com exclusividade nesse período (regra em vigor desde 24/05/2026). Quem registra o CIOT é o contratante.</p>
  <p class="src">Fontes: Portaria SUROC 6/2026; Resoluções ANTT 6.077 e 6.078/2026.</p></div>

  <div class="rule"><h4>3. Prazo de pagamento: até 30 dias úteis</h4>
  <p>O frete tem que ser pago em até 30 dias úteis. Vale para contratos assinados desde 06/08/2026 e, desde 05/11/2026, também para contratos que já existiam.</p>
  <p>Se o contratante atrasar: paga o valor corrigido, multa de R$ 10.500, indenização ao transportador e pode sofrer restrição para operar. O app avisa no Painel quando um frete passa desse prazo.</p>
  <p class="src">Fonte: Comunicado Geral SUROC nº 1/2026 (ANTT).</p></div>

  <div class="rule"><h4>4. RNTRC em dia</h4>
  <ul><li>Sem RNTRC ativo não pode fazer transporte remunerado.</li>
  <li>Quem recolhe o INSS por conta própria precisa comprovar que está em dia, senão a inscrição ou a revalidação do RNTRC pode ser suspensa.</li>
  <li>A ANTT também exige comprovar os seguros obrigatórios do transporte de cargas; quem não comprovar pode ter o RNTRC suspenso.</li></ul>
  <p class="src">Fontes: Lei 15.485/2026, art. 5º; Portaria ANTT 27/2025.</p></div>

  <div class="rule"><h4>5. Vale-pedágio</h4>
  <p>O pedágio da viagem deve ser pago pelo embarcador, à parte do frete (Lei 10.209/2001). Se o vale-pedágio veio, não lance o pedágio como gasto seu.</p></div>

  <div class="rule"><h4>6. Tempo de direção, descanso e o que vale para van</h4>
  <ul><li>No máximo <b>5h30 dirigindo sem parar</b>, com 30 minutos de descanso.</li>
  <li><b>11 horas de descanso</b> a cada 24 horas (pode dividir, com um período de pelo menos 8h seguidas).</li>
  <li>Descumprir é infração média, com multa e retenção do veículo até cumprir o descanso.</li>
  <li>Exame toxicológico periódico obrigatório para CNH C, D e E. Van de até 3.500 kg de peso total pode ser dirigida com CNH B, e aí o exame não é exigido.</li><li>Tacógrafo só é obrigatório em veículo de carga com peso bruto total acima de 4.536 kg. Confira no documento da van.</li></ul>
  <p class="src">Fontes: Lei 13.103/2015; CTB.</p></div>
  </div>`;

  h += `<div class="card"><h3>🔗 Links úteis</h3>

function datalists() {
  const uniq = arr => [...new Map(arr.filter(Boolean).map(x => [norm(x), title(x)])).values()].sort();
  const dl = (id, arr) => `<datalist id="${id}">${uniq(arr).map(x => `<option value="${esc(x)}">`).join('')}</datalist>`;
  return dl('origens', [...S.viagens.map(v => v.origem), ...S.viagens.map(v => v.destino)]) + dl('destinos', [...S.viagens.map(v => v.destino), ...S.viagens.map(v => v.origem)]) + dl('contratantes', S.viagens.map(v => v.contratante)) + dl('postos', S.abast.map(a => a.posto)) + dl('oficinas', S.servicos.map(s => s.oficina)) + dl('docsSug', DOCS_SUG);
}
function fieldHtml(f, o) {
  const [k, label, type, opt0] = f; const opt = opt0 || {};
  let v = o[k]; if (v == null && opt.def) v = opt.def(); if (v == null) v = '';
  const req = opt.req ? ' <span style="color:var(--bad)">*</span>' : '';
  const hint = opt.hint ? `<div class="hint">${opt.hint}</div>` : '';
  let input;
  if (type === 'textarea') input = `<textarea class="inp" name="${k}">${esc(v)}</textarea>`;
  else if (type === 'select') input = `<select class="inp" name="${k}">${opt.req && !v ? '<option value="">Escolha…</option>' : ''}${opt.opts.map(x => `<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
  else if (type === 'check') return `<label class="check"><input type="checkbox" name="${k}" ${v ? 'checked' : ''}> ${label}</label>`;
  else if (type === 'viagem') { const vs = S.viagens.slice().sort((a, b) => (b.dataSaida||'').localeCompare(a.dataSaida||'')).slice(0, 40); input = `<select class="inp" name="${k}"><option value="">Nenhuma</option>${vs.map(x => `<option value="${x.id}" ${x.id===v?'selected':''}>${fmtDs(x.dataSaida)} · ${esc(title(x.origem))} → ${esc(title(x.destino))}</option>`).join('')}</select>`; }
  else if (type === 'plano') input = `<select class="inp" name="${k}"><option value="">Nenhum (serviço avulso)</option>${S.manut.map(x => `<option value="${x.id}" ${x.id===v?'selected':''}>${esc(x.item)}</option>`).join('')}</select>`;
  else { const t = type === 'date' ? 'date' : (type === 'money' || type === 'dec' || type === 'int') ? 'number' : 'text'; const im = type === 'int' ? 'numeric' : (type === 'money' || type === 'dec') ? 'decimal' : ''; const st = type === 'int' ? '1' : '0.01'; input = `<input class="inp" name="${k}" type="${t}" ${t==='number' ? `step="${st}" inputmode="${im}" min="0"` : ''} ${opt.list ? `list="${opt.list}" autocomplete="off"` : ''} value="${esc(v)}" placeholder="${esc(opt.ph || '')}">`; }
  return `<div class="field"><label>${label}${req}</label>${input}${hint}</div>`;
}
function openForm(col, id, preset) {
  const F = FORMS[col]; const o = id ? Object.assign({}, S[col].find(x => x.id === id)) : Object.assign({}, preset || {});
  const map = {}; F.fields.forEach(f => map[f[0]] = f);
  const skip = new Set(); let body = '';
  F.fields.forEach(f => { if (skip.has(f[0])) return; if (f[2] === 'row') { f[3].forEach(k => skip.add(k)); body += `<div class="frow">${f[3].map(k => fieldHtml(map[k], o)).join('')}</div>`; } else body += fieldHtml(f, o); });
  let extra = '';
  if (col === 'viagens') extra = `<div class="calc" id="calcV"></div>`;
  if (col === 'abast') extra = `<div class="calc" id="calcA"></div>`;
  const ov = modal(`<h3>${id ? 'Editar' : 'Nova'} ${F.t.toLowerCase()}</h3><form id="frm" novalidate>${body}${extra}<div class="row" style="margin-top:6px">${id ? '<button type="button" class="btn danger" id="btnDel">Excluir</button>' : ''}<span class="grow"></span><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri" type="submit">Salvar</button></div></form>${datalists()}`);
  const frm = $('#frm', ov);
  const read = () => { const out = {}; F.fields.forEach(([k, , type]) => { if (type === 'row') return; const el = frm.elements[k]; if (!el) return; if (type === 'check') out[k] = el.checked; else if (type === 'money' || type === 'dec' || type === 'int') out[k] = el.value === '' ? '' : num(el.value); else out[k] = el.value.trim(); }); return out; };
  const upd = () => {
    const x = read();
    if (col === 'viagens') { const km = (x.odoIni && x.odoFim && x.odoFim > x.odoIni) ? x.odoFim - x.odoIni : num(x.km); const box = $('#calcV', ov); let t = []; if (km && x.valorFrete) t.push(`💰 ${R$(x.valorFrete / km)} por km`); if (x.adiantamento && x.valorFrete) t.push(`Saldo a receber: <b>${R$(x.valorFrete - x.adiantamento)}</b>`); if (x.piso && x.valorFrete) t.push(x.valorFrete < x.piso ? `<span class="neg">⚠️ ${R$(x.piso - x.valorFrete)} abaixo do piso ANTT</span>` : `<span class="pos">✅ acima do piso (+${R$(x.valorFrete - x.piso)})</span>`); if (!x.prevPag && (x.dataChegada || x.dataSaida) && x.statusPag !== 'Pago') t.push(`Prazo legal de pagamento: ${fmtD(addBusinessDays(x.dataChegada || x.dataSaida, 30))}`); if (x.odoIni && x.odoFim && x.odoFim > x.odoIni) frm.elements.km.value = x.odoFim - x.odoIni; box.innerHTML = t.join('<br>') || 'Preencha frete e km para ver o valor por km.'; box.style.display = ''; }
    if (col === 'abast') { const box = $('#calcA', ov); const t = []; if (x.litros && x.valor) t.push(`Preço: <b>${R$(x.valor / x.litros)}/L</b>`); if (x.odometro && x.litros) { const prev = S.abast.filter(a => a.id !== id && num(a.odometro) > 0 && num(a.odometro) < x.odometro).sort((a, b) => num(b.odometro) - num(a.odometro))[0]; if (prev) { const kml = (x.odometro - num(prev.odometro)) / x.litros; t.push(`Consumo desde o último: <b>${N(kml,2)} km/L</b> (${N(x.odometro - num(prev.odometro))} km)`); } } box.innerHTML = t.join('<br>') || 'Informe litros, valor e odômetro.'; }
  };
  frm.addEventListener('input', upd); upd();
  if (col === 'servicos') frm.elements.planoId.addEventListener('change', e => { const p = S.manut.find(m => m.id === e.target.value); if (p) { if (!frm.elements.descricao.value) frm.elements.descricao.value = p.item; frm.elements.tipo.value = p.tipo || 'Manutenção'; } });
  frm.addEventListener('submit', async e => {
    e.preventDefault(); const x = read();
    const miss = F.fields.filter(([k, l, t, opt]) => opt && opt.req && t !== 'row' && (x[k] === '' || x[k] == null)).map(f => f[1]);
    if (miss.length) { toast('Preencha: ' + miss.join(', ')); return; }
    if (col === 'viagens') { x.origem = title(x.origem); x.destino = title(x.destino); x.contratante = title(x.contratante); if (x.statusPag === 'Pago' && !o.dataPago) x.dataPago = today(); }
    const obj = Object.assign(o, x); if (id) obj.id = id;
    const ok = await save(col, obj);
    if (ok && col === 'servicos' && obj.planoId) { const p = S.manut.find(m => m.id === obj.planoId); if (p && (!p.ultimaData || obj.data >= p.ultimaData)) { p.ultimaData = obj.data; if (num(obj.km)) p.ultimoKm = num(obj.km); await save('manut', Object.assign({}, p)); } }
    close(ov); toast('Salvo ✔'); render();
  });
  const bd = $('#btnDel', ov);
  if (bd) bd.onclick = () => confirmBox('Excluir este registro?', 'Essa ação não pode ser desfeita.', async () => { await del(col, id); close(ov); toast('Excluído'); render(); });
}
function modal(html) { const ov = document.createElement('div'); ov.className = 'ov'; ov.innerHTML = `<div class="sheet">${html}</div>`; ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-close]')) close(ov); }); document.body.appendChild(ov); document.body.style.overflow = 'hidden'; return ov; }
function close(ov) { ov.remove(); if (!document.querySelector('.ov')) document.body.style.overflow = ''; }
function confirmBox(t, s, yes) { const ov = modal(`<h3>${esc(t)}</h3><p class="ink2">${esc(s)}</p><div class="row"><span class="grow"></span><button class="btn" data-close>Cancelar</button><button class="btn danger" id="yes">Confirmar</button></div>`); $('#yes', ov).onclick = async () => { close(ov); await yes(); }; }

  const app = $('#app');
  app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { UI.p = b.dataset.p; UI.ref = new Date(); render(); });
  app.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => { UI.ref = shiftRef(UI.p, UI.ref, +b.dataset.nav); render(); });
  app.querySelectorAll('[data-new]').forEach(b => b.onclick = () => openForm(b.dataset.new));
  app.querySelectorAll('[data-edit]').forEach(b => b.onclick = e => { if (e.target.closest('button,a')) return; openForm(b.dataset.edit, b.dataset.id); });
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = e => { e.preventDefault(); go(b.dataset.go); });
  app.querySelectorAll('[data-gtab]').forEach(b => b.onclick = () => { UI.gTab = b.dataset.gtab; render(); });
  app.querySelectorAll('[data-mtab]').forEach(b => b.onclick = () => { UI.mTab = b.dataset.mtab; render(); });
  app.querySelectorAll('[data-bind]').forEach(el => {
    const k = el.dataset.bind;
    if (k === 'busca') el.oninput = () => { UI.busca = el.value; const pos = el.selectionStart; render(); const n = $('[data-bind="busca"]'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} };
    else el.onchange = () => { UI[k] = el.value; render(); };
  });
  app.querySelectorAll('[data-pagar]').forEach(b => b.onclick = async () => {
    const c = S.contas.find(x => x.id === b.dataset.pagar); const ref = b.dataset.ref; const i = contaInfo(c, ref);
    const ov = modal(`<h3>Pagar ${esc(c.nome)}</h3><form id="pf"><div class="frow"><div class="field"><label>Data do pagamento</label><input class="inp" name="data" type="date" value="${today()}"></div><div class="field"><label>Valor pago (R$)</label><input class="inp" name="valor" type="number" step="0.01" inputmode="decimal" value="${num(c.valor)}"></div></div><div class="small muted" style="margin-bottom:12px">Referente a ${MESES[+ref.slice(5)-1]} de ${ref.slice(0,4)}${i.total ? ' · parcela ' + (i.pagas + 1) + ' de ' + i.total : ''}. Vai entrar nos gastos.</div><div class="row"><span class="grow"></span><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri">Confirmar</button></div></form>`);
    $('#pf', ov).onsubmit = async e => { e.preventDefault(); const f = e.target.elements; await save('gastos', {data: f.data.value || today(), categoria: CAT_GASTO.includes(c.categoria) ? c.categoria : 'Outros', valor: num(f.valor.value), descricao: c.nome + (i.total ? ` (${i.pagas+1}/${i.total})` : ''), contaId: c.id, ref}); close(ov); toast('Pagamento registrado ✔'); render(); };
  });
  app.querySelectorAll('[data-feito]').forEach(b => b.onclick = () => { const p = S.manut.find(m => m.id === b.dataset.feito); openForm('servicos', null, {planoId: p.id, descricao: p.item, tipo: p.tipo || 'Manutenção'}); });
  app.querySelectorAll('[data-act]').forEach(b => b.onclick = () => ACT[b.dataset.act] && ACT[b.dataset.act](b));
  const imp = $('#impFile'); if (imp) imp.onchange = e => importFile(e.target.files[0]);
  const pz = ['pzF','pzP','pzK','pzV'].map(i => $('#' + i));
  if (pz[0]) { const f = () => { const F = num(pz[0].value), P = num(pz[1].value), K = num(pz[2].value); const out = $('#pzOut'); if (!F || !P) { out.innerHTML = 'Preencha frete e piso para comparar.'; return; } const d = F - P; let s = d >= 0 ? `<span class="pos"><b>✅ Frete OK:</b> ${R$(d)} acima do piso (${N(d/P*100,1)}%).</span>` : `<span class="neg"><b>⚠️ Abaixo do piso:</b> faltam ${R$(-d)}. Pela lei, esse frete não pode ser contratado nem registrar CIOT.</span>`; if (K) s += `<br>Frete: ${R$(F/K)}/km · Piso: ${R$(P/K)}/km`; const custo = custoKmHist(); if (K && custo) s += `<br>Seu custo médio: ${R$(custo)}/km → sobra estimada de <b>${R$(F - custo*K)}</b>`; if (pz[3].value === '0') s += `<br><span class="muted">Lembre: o pedágio deveria vir em vale-pedágio, separado do frete.</span>`; out.innerHTML = s; }; pz.forEach(el => el.oninput = el.onchange = f); }
}
function custoKmHist() { const r = range('tudo'); const km = S.viagens.reduce((a, v) => a + kmViagem(v), 0); const g = despesas().reduce((a, d) => a + d.valor, 0); return km > 500 ? g / km : 0; }

const ACT = {
  async saveCfg() { const o = Object.assign({}, cfg(), {id:'principal'}); document.querySelectorAll('[data-cfg]').forEach(el => { const k = el.dataset.cfg; o[k] = el.type === 'number' ? (el.value === '' ? '' : num(el.value)) : el.value.trim(); }); if (o.placa) o.placa = o.placa.toUpperCase(); if (await save('config', o)) toast('Ajustes salvos ✔'); render(); },
  odo() { const ov = modal(`<h3>Atualizar odômetro</h3><form id="of"><div class="field"><label>KM atual da van</label><input class="inp" name="km" type="number" inputmode="numeric" value="${odometroAtual() || ''}"></div><div class="row"><span class="grow"></span><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri">Salvar</button></div></form>`); $('#of', ov).onsubmit = async e => { e.preventDefault(); const km = num(e.target.elements.km.value); const o = Object.assign({}, cfg(), {id:'principal', odometro: km}); await save('config', o); close(ov); if (km < odometroAtual()) toast('Atenção: há registros com km maior que esse.'); render(); }; },
  async padrao() { const odo = odometroAtual(); for (const m of MANUT_PADRAO) await save('manut', Object.assign({}, m, {ultimoKm: odo || '', ultimaData: ''})); toast('Lista padrão criada. Ajuste a data da última troca de cada item.'); render(); },
  async docsPadrao() { for (const n of ['RNTRC (ANTT)','CNH','Exame toxicológico','CRLV / Licenciamento','Seguro da van']) await save('docs', {nome: n, vencimento: ''}); toast('Lista criada. Toque em cada um para colocar a data.'); render(); },
  async share() {
    const {json, fn} = backupJson();
    try {
      const file = new File([json], fn, {type: 'application/json'});
      if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: 'Backup Minha Van', text: 'Backup do app Minha Van de ' + fmtD(today())}); marcarBackup(); toast('Backup enviado ✔'); render(); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    toast('Este celular não deixa compartilhar arquivo. Vou baixar o backup.'); ACT.export();
  },
  async export() {
    const {json, fn} = backupJson();
    try {
      const blob = new Blob([json], {type: 'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fn; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      marcarBackup(); toast('Backup salvo na pasta Downloads ✔'); setTimeout(render, 300); return;
    } catch (e) {}
    const box = $('#expBox'); box.innerHTML = `<div class="field" style="margin-top:10px"><label>Copie este texto e guarde no WhatsApp ou no e-mail:</label><textarea class="inp" readonly style="min-height:120px;font-size:12px">${esc(json)}</textarea></div><button class="btn sm dark" id="cpy">Copiar</button>`;
    $('#cpy').onclick = async () => { try { await navigator.clipboard.writeText(json); marcarBackup(); toast('Copiado ✔'); } catch (e) { box.querySelector('textarea').select(); } };
  },
  async instalar() { if (!INSTALL.ev) return; INSTALL.ev.prompt(); try { await INSTALL.ev.userChoice; } catch (e) {} INSTALL.ev = null; render(); },
};
function backupJson() { const o = {app:'minha-van', versao:2, exportadoEm:new Date().toISOString(), dados:{}}; COLS.forEach(c => o.dados[c] = S[c]); return {json: JSON.stringify(o), fn: 'backup-minha-van-' + today() + '.json'}; }
async function importFile(file) {
  if (!file) return;
  let o; try { o = JSON.parse(await file.text()); } catch (e) { toast('Arquivo inválido'); return; }
  const d = o && o.dados; if (!d) { toast('Esse arquivo não é um backup do app'); return; }
  const n = COLS.reduce((a, c) => a + (Array.isArray(d[c]) ? d[c].length : 0), 0);
  confirmBox('Restaurar backup?', `${n} registros serão adicionados ou atualizados. Os registros atuais com o mesmo código serão substituídos.`, async () => {
    for (const c of COLS) for (const r of (d[c] || [])) if (r && r.id) await save(c, Object.assign({}, r));
    toast('Backup restaurado ✔'); render();
  });
}

/* Tooltip */
const tip = $('#tip');
function showTip(el, x, y) { const t = el.getAttribute('data-tip'); if (!t) return; tip.innerHTML = t; tip.style.left = Math.max(80, Math.min(window.innerWidth - 80, x)) + 'px'; tip.style.top = (y + window.scrollY) + 'px'; tip.style.position = 'absolute'; tip.style.opacity = 1; }
document.addEventListener('pointermove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el && e.pointerType === 'mouse') showTip(el, e.clientX, e.clientY - 8); else if (e.pointerType === 'mouse') tip.style.opacity = 0; });
document.addEventListener('click', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) { const r = el.getBoundingClientRect(); showTip(el, e.clientX || r.left + r.width/2, (e.clientY || r.top) - 8); clearTimeout(showTip.t); showTip.t = setTimeout(() => tip.style.opacity = 0, 3000); } else tip.style.opacity = 0; });

$('#fab').onclick = quickAdd;
$('#btnCfg').onclick = () => go('ajustes');
document.querySelectorAll('#bnav button').forEach(b => b.onclick = () => go(b.dataset.v));

/* Início */
const INSTALL = {ev: null, standalone: (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true};
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALL.ev = e; if (UI.view === 'ajustes') render(); });
window.addEventListener('appinstalled', () => { INSTALL.ev = null; INSTALL.standalone = true; toast('App instalado ✔'); });
testarStorage(); loadLocal();
{ const h = location.hash.slice(1); if (VIEWS.includes(h)) UI.view = h; }
setSync(); render(); pedirPersistencia();
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => { const w = reg.installing; if (!w) return; w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) toast('Nova versão do app disponível. Feche e abra de novo para atualizar.'); }); });
  }).catch(() => {}); });
}
</script>
